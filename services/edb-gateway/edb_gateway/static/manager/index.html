<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDB Manager</title>
  <link rel="stylesheet" href="/manager/static/manager.css">
</head>
<body>
  <header>
    <h1>EDB Manager</h1>
    <p class="sub">Local-first manager. Unlock with a passphrase to encrypt/decrypt records end-to-end in your browser — the gateway and device only ever see ciphertext.</p>
  </header>
  <main>
    <section id="connect-panel">
      <h2>Connect</h2>
      <label>Port <input id="port" value="mock" placeholder="COM3 or mock"></label>
      <label>Baud <input id="baud" type="number" value="115200"></label>
      <label><input id="encrypt" type="checkbox" checked> Pair session (transport encryption not yet wired)</label>
      <label><input id="mock" type="checkbox" checked> Mock device (no hardware)</label>
      <button id="btn-connect">Connect</button>
      <button id="btn-disconnect" disabled>Disconnect</button>
      <span id="conn-status"></span>
    </section>
    <section id="unlock-panel" class="hidden">
      <h2>Unlock</h2>
      <label>Passphrase <input id="passphrase" type="password" autocomplete="off"></label>
      <button id="btn-unlock">Derive keys locally</button>
      <span id="unlock-status"></span>
    </section>
    <section id="tables-panel" class="hidden">
      <h2>Tables</h2>
      <ul id="table-list"></ul>
      <h3>Create table</h3>
      <label>head_ptr <input id="create-head" type="number" value="0"></label>
      <label>table_size <input id="create-size" type="number" value="8192"></label>
      <label>rec_size <input id="create-rec" type="number" value="8"></label>
      <button id="btn-create">Create</button>
    </section>
    <section id="records-panel" class="hidden">
      <h2>Records <span id="table-label"></span></h2>
      <button id="btn-refresh">Refresh</button>
      <table id="records-table"><thead><tr><th>recno</th><th>payload</th><th></th></tr></thead><tbody></tbody></table>
      <h3>Append</h3>
      <label>payload <input id="append-payload" size="40" placeholder="hex when unlocked, else base64"></label>
      <button id="btn-append">Append</button>
    </section>
  </main>
  <script src="/manager/static/manager.js"></script>
</body>
</html>
