[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edb-gateway"
version = "1.0.0"
description = "REST gateway and web manager for EDB on microcontrollers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyserial>=3.5",
  "pydantic>=2.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["edb_gateway*"]

[tool.setuptools.package-data]
edb_gateway = ["static/manager/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
